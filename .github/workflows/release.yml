# Release gsbatch : publie sur GitHub Packages à chaque tag vX.Y.Z.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# La version Maven est injectée depuis le tag (versions:set) : le pom garde
# une version de développement -SNAPSHOT entre les releases, aucun commit de
# version n'est nécessaire pour publier.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github   # doit correspondre au distributionManagement du pom

      - name: Set version from tag
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and verify
        run: mvn -B clean verify

      - name: Publish to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
