# Source d'intégration : CSV → writer SQL déclaratif (SqlGenericItemWriter sur H2).
# Le fichier CSV est écrit par le test dans target/it-data/ avant le lancement.
name: it-csv-sqlwriter
type: CSV
chunkSize: 2

path: target/it-data/it-orders.csv
delimiter: ";"
skipHeader: true

columns:
  - name: order_id
    type: STRING
  - name: amount
    type: STRING

writer:
  type: SQL
  sqlDirectory: classpath:sql-it
  sqlFile: insert_it_orders.sql
